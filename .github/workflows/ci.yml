name: ci

# KEEP IN SYNC: bin/ci-local.sh runs these same steps in the same order locally.
# Change one, change the other.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify the pushed commit messages are conventional
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$SHA"
          elif [ "$BEFORE" != "$zero" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null; then
            range="$BEFORE..$SHA"
          elif git fetch -q origin latest 2>/dev/null; then
            # first push of a branch, or a before-commit this clone cannot see (force push)
            range="FETCH_HEAD..$SHA"
          else
            range="$SHA"
          fi
          echo "checking $range"
          bash bin/check-version.sh messages "$range"

      - name: Verify one consistent version across the sources
        run: bash bin/check-version.sh consistency

      - name: Syntax-check the theme scripts
        run: |
          set -eu
          for f in init.js js/*.js lang/*.js; do
            node --check "$f"
          done

      - name: Verify the string catalog
        run: sh bin/check-lang.sh

      - name: Verify the asset cache stamp is current
        run: bash bin/stamp.sh --check

      - name: Self-test the release tool
        run: bash bin/release.sh --selftest

      - name: Self-test the stamp tool
        run: bash bin/stamp.sh --selftest

      - name: Self-test the version guards
        run: bash bin/check-version.sh --selftest
