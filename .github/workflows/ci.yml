name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Syntax-check the theme scripts
        run: |
          set -eu
          for f in init.js js/*.js lang/*.js; do
            node --check "$f"
          done

      - name: Verify the string catalog
        run: sh bin/check-lang.sh

      - name: Verify the asset cache stamp is current
        run: bash bin/stamp.sh --check

      - name: Self-test the release tool
        run: bash bin/release.sh --selftest

      - name: Self-test the stamp tool
        run: bash bin/stamp.sh --selftest
